name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run check

      - name: Test backend
        run: dotnet test backend/GameCatalog.slnx --configuration Release

      - name: Publish backend
        run: dotnet publish backend/src/GameCatalog.Api -c Release -o publish

      - name: Bundle frontend into wwwroot
        run: |
          mkdir -p publish/wwwroot
          cp -r frontend/dist/game-catalog/browser/. publish/wwwroot/

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: gamecatalog-ivashchenko
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish

      - name: Verify deployed application
        shell: bash
        run: |
          for attempt in {1..18}; do
            if curl --fail --silent --show-error --max-time 15 \
              https://gamecatalog-ivashchenko.azurewebsites.net/health \
              && curl --fail --silent --show-error --max-time 15 \
              https://gamecatalog-ivashchenko.azurewebsites.net/ > /dev/null; then
              echo "Deployment is healthy."
              exit 0
            fi

            echo "Health check attempt ${attempt} failed; retrying in 10 seconds."
            sleep 10
          done

          echo "Deployment did not become healthy."
          exit 1
