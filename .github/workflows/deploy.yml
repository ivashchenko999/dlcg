name: Deploy

# Release Please calls this workflow after creating a GitHub Release. The
# Actions tab remains available for recovery, but pushing a tag does not deploy:
# Release Please is the single owner of version tags and GitHub Releases.
on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run check

      - name: Test backend
        run: dotnet test backend/GameCatalog.slnx --configuration Release

      - name: Publish backend
        run: dotnet publish backend/src/GameCatalog.Api -c Release -o publish

      - name: Bundle frontend into wwwroot
        run: |
          mkdir -p publish/wwwroot
          cp -r frontend/dist/game-catalog/browser/. publish/wwwroot/

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: gamecatalog-ivashchenko
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish

      - name: Verify deployed application
        shell: bash
        run: |
          for attempt in {1..18}; do
            base_url="https://gamecatalog-ivashchenko.azurewebsites.net"
            if curl --fail --silent --show-error --max-time 15 "$base_url/health"; then
              html=$(curl --fail --silent --show-error --max-time 15 "$base_url/")
              main_script=$(printf '%s' "$html" | grep -oE 'src="[^"]*main-[^"]+\.js"' | head -n 1 | cut -d '"' -f 2)

              if [ -n "$main_script" ]; then
                content_type=$(curl --fail --silent --show-error --max-time 15 \
                  --output /dev/null --write-out '%{content_type}' "$base_url/${main_script#/}")

                if [[ "$content_type" == *javascript* ]]; then
                  if genres=$(curl --fail --silent --show-error --max-time 15 \
                    "$base_url/api/genres") && \
                    games=$(curl --fail --silent --show-error --max-time 15 \
                    "$base_url/api/games?pageSize=1") && \
                    node -e '
                      const genres = JSON.parse(process.argv[1]);
                      const games = JSON.parse(process.argv[2]);
                      if (!Array.isArray(genres) || !genres.every(
                        genre => Number.isInteger(genre.id) && typeof genre.name === "string"
                      )) process.exit(1);
                      if (!games || !Array.isArray(games.items) ||
                          typeof games.totalCount !== "number" ||
                          typeof games.page !== "number" ||
                          typeof games.pageSize !== "number") process.exit(1);
                    ' "$genres" "$games"; then
                    echo "Deployment is healthy; frontend assets and database-backed APIs work."
                    exit 0
                  fi

                  echo "Database-backed API smoke check failed."
                else
                  echo "Frontend asset has invalid content type: $content_type"
                fi
              fi
            fi

            echo "Health check attempt ${attempt} failed; retrying in 10 seconds."
            sleep 10
          done

          echo "Deployment did not become healthy."
          exit 1
