<a routerLink="/games" class="btn btn-link px-0 mb-2">
  <i class="bi bi-arrow-left me-1"></i>Back to list
</a>

<div class="row">
  <div class="col-lg-7 col-xl-6">
    <div class="card shadow-sm">
      <div class="card-header py-3">
        <h1 class="h4 mb-0">
          <i class="bi me-2" [class.bi-pencil-square]="isEdit()" [class.bi-plus-circle]="!isEdit()"></i>
          {{ isEdit() ? 'Edit game' : 'New game' }}
        </h1>
      </div>
      <div class="card-body">
        <app-error-alert [message]="error()" />

        @if (loading()) {
          <app-loading-spinner />
        } @else {
          <form [formGroup]="form" (ngSubmit)="save()">
            <div class="mb-3">
              <label class="form-label" for="title">Title</label>
              <input
                id="title"
                type="text"
                class="form-control"
                placeholder="e.g. The Witcher 3: Wild Hunt"
                formControlName="title"
                [class.is-invalid]="isInvalid('title')"
              />
              <div class="invalid-feedback">Title is required (200 characters max).</div>
            </div>

            <div class="mb-3">
              <label class="form-label" for="developer">Developer</label>
              <input
                id="developer"
                type="text"
                class="form-control"
                placeholder="e.g. CD Projekt Red"
                formControlName="developer"
                [class.is-invalid]="isInvalid('developer')"
              />
              <div class="invalid-feedback">Developer is required (200 characters max).</div>
            </div>

            <div class="mb-3">
              <label class="form-label" for="genre">Genre</label>
              <select
                id="genre"
                class="form-select"
                formControlName="genreId"
                [class.is-invalid]="isInvalid('genreId')"
              >
                <option [ngValue]="null" disabled>Choose a genre…</option>
                @for (genre of genres(); track genre.id) {
                  <option [ngValue]="genre.id">{{ genre.name }}</option>
                }
              </select>
              <div class="invalid-feedback">Genre is required.</div>
            </div>

            <div class="row">
              <div class="col-sm-7 mb-3">
                <label class="form-label" for="releaseDate">Release date</label>
                <div class="input-group">
                  <input
                    id="releaseDate"
                    class="form-control"
                    placeholder="yyyy-mm-dd"
                    formControlName="releaseDate"
                    ngbDatepicker
                    #datepicker="ngbDatepicker"
                    [class.is-invalid]="isInvalid('releaseDate')"
                  />
                  <button
                    type="button"
                    class="btn btn-outline-secondary"
                    aria-label="Open calendar"
                    (click)="datepicker.toggle()"
                  >
                    <i class="bi bi-calendar3"></i>
                  </button>
                  <div class="invalid-feedback">A valid release date is required.</div>
                </div>
              </div>

              <div class="col-sm-5 mb-3">
                <label class="form-label" for="price">Price</label>
                <div class="input-group">
                  <span class="input-group-text">$</span>
                  <input
                    id="price"
                    type="number"
                    class="form-control"
                    formControlName="price"
                    min="0"
                    step="0.01"
                    [class.is-invalid]="isInvalid('price')"
                  />
                  <div class="invalid-feedback">Price must be between 0 and 10&#8239;000.</div>
                </div>
              </div>
            </div>

            <div class="d-flex gap-2 mt-2">
              <button type="submit" class="btn btn-primary" [disabled]="saving()">
                @if (saving()) {
                  <span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span>
                } @else {
                  <i class="bi bi-check-lg me-1"></i>
                }
                Save
              </button>
              <a routerLink="/games" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </form>
        }
      </div>
    </div>
  </div>
</div>
